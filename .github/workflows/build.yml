name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout proiect
      uses: actions/checkout@v4

    - name: Configurare Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurare Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ruleaza curatare si compilare APK
      run: gradle assembleDebug

    - name: Incarca APK ca Artefact
      uses: actions/upload-artifact@v4
      with:
        name: VremeaLive-apk
        path: main/build/outputs/apk/debug/main-debug.apk
